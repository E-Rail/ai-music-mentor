<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 音乐导师 · 技术 Demo</title>
    <style>
      .boot-message {
        box-sizing: border-box;
        width: min(680px, calc(100% - 32px));
        margin: 12vh auto 0;
        padding: 28px;
        color: #ece8e2;
        background: #1e1a26;
        border: 1px solid #383043;
        border-radius: 16px;
        font: 15px/1.65 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      }
      .boot-message h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -.01em; }
      .boot-message p { margin: 8px 0; color: #9a91a5; }
      .boot-message code { display: block; margin: 16px 0; padding: 12px; overflow-x: auto; color: #d6a756; background: #14121a; border-radius: 8px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .boot-message a { color: #d6a756; }
      body { margin: 0; min-height: 100vh; background: #14121a; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="boot-message" class="boot-message" role="status">
        <h1>AI 音乐导师</h1>
        <p id="boot-status">正在启动应用…</p>
        <div id="direct-file-help" hidden>
          <p>这个 index.html 需要前端编译器和分析服务，不能像普通网页一样直接双击运行。</p>
          <p>请在项目根目录运行对应系统的启动器：</p>
          <code>bash launch.sh</code>
          <code>powershell -ExecutionPolicy Bypass -File .\launch.ps1</code>
          <p>服务启动后，访问 <a href="http://127.0.0.1:8000">http://127.0.0.1:8000</a>。</p>
        </div>
      </main>
    </div>
    <script>
      (() => {
        const bootMessage = document.getElementById('boot-message')
        const status = document.getElementById('boot-status')
        const help = document.getElementById('direct-file-help')
        if (location.protocol === 'file:') {
          status.textContent = '此文件不能直接打开。'
          help.hidden = false
          return
        }
        window.setTimeout(() => {
          if (bootMessage?.isConnected) {
            status.textContent = '应用脚本未能启动。请检查本地服务是否完整运行后刷新页面。'
            help.hidden = false
          }
        }, 5000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
