onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - gl
allowBuilds:
  core-js: false
  esbuild: true
  gl: false
  # Its postinstall only sets up protobufjs' own CLI. Magenta uses the
  # pre-generated static proto module, so there is nothing to build.
  protobufjs: false
patchedDependencies:
  '@magenta/music@1.23.1': patches/@magenta__music@1.23.1.patch
