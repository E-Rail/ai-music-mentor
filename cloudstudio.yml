# CloudStudio 部署配置
# 部署后通过分配的预览地址访问 AI 音乐导师 Demo。
# 应用为单镜像：前端（Vite 构建）与 FastAPI 后端同源运行在 $PORT（默认 8000）。

app:
  # 服务名称，会作为预览子域名前缀
  name: ai-music-mentor
  # 使用项目根目录的 Dockerfile 构建同一镜像（已含前端构建 + 后端）
  runtime: docker
  dockerfile: Dockerfile
  # CloudStudio 注入 PORT 环境变量，entrypoint 已支持
  port: 8000
  # 健康检查：复用已有的 readiness 端点
  healthcheck:
    path: /api/v1/readiness
    interval: 10s
    timeout: 3s
    retries: 10
  # 构建/运行时环境变量（可不填，留空则使用确定性本地规则导师）
  env:
    APP_ENV: production
    DATA_DIR: /data
    # 可选：接入 OpenAI-compatible 模型导师（不填则用内置中文规则导师）
    # MENTOR_API_BASE: https://openrouter.ai/api/v1
    # MENTOR_API_KEY: replace-with-your-server-side-api-key
    # MENTOR_MODEL: deepseek/deepseek-v4-flash-0731
    # MENTOR_RESPONSE_MODE: json_schema
  # 持久化数据目录（SQLite 数据库与上传/生成文件）
  volumes:
    - /data
