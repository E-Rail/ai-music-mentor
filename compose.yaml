services:
  mentor:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATA_DIR: /data
      MENTOR_API_BASE: ${MENTOR_API_BASE:-}
      MENTOR_API_KEY: ${MENTOR_API_KEY:-}
      MENTOR_MODEL: ${MENTOR_MODEL:-}
      MENTOR_RESPONSE_MODE: ${MENTOR_RESPONSE_MODE:-json_object}
      MENTOR_REASONING_EFFORT: ${MENTOR_REASONING_EFFORT:-low}
      MENTOR_TIMEOUT_SECONDS: ${MENTOR_TIMEOUT_SECONDS:-8}
      MENTOR_MAX_OUTPUT_TOKENS: ${MENTOR_MAX_OUTPUT_TOKENS:-1600}
    volumes:
      - mentor-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mentor-data:
