services:
  mentor:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATA_DIR: /data
    # Everything the mentor and the score reader need comes straight from .env.
    # Listing the keys here instead meant the list drifted: the vision reader and
    # the provider pins were added upstream and never reached the container. The
    # app has its own defaults, so a missing file is not an error.
    env_file:
      - path: .env
        required: false
    volumes:
      - mentor-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mentor-data:
